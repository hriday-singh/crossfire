services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crossfire-frontend
    restart: unless-stopped
    ports:
      - "0.0.0.0:9125:80"
    depends_on:
      - backend

  gemini-web2api:
    build:
      context: ./tools/gemini-web2api
      dockerfile: Dockerfile
    container_name: gemini-web2api
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crossfire-backend
    restart: unless-stopped
    ports:
      - "0.0.0.0:9126:8000"
    environment:
      - SQLITE_DB_PATH=/app/data/crossfire.db
      - PORT=8000
      - LLM_PROVIDER=${LLM_PROVIDER:-openai_compat}
      # Reachable over the compose network by service name. Do NOT use
      # host.docker.internal: the proxy is a sibling container, not a host process.
      - LLM_BASE_URL=${LLM_BASE_URL:-http://gemini-web2api:8081/v1}
      - LLM_API_KEY=${LLM_API_KEY:-sk-gemini}
      - CORS_ALLOWED_ORIGINS=https://crossfire.stratizone.com,http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      - gemini-web2api
    volumes:
      - crossfire-data:/app/data

volumes:
  crossfire-data:
