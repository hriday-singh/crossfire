services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crossfire-frontend
    restart: unless-stopped
    ports:
      - "0.0.0.0:9125:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crossfire-backend
    restart: unless-stopped
    ports:
      - "0.0.0.0:9126:8000"
    environment:
      - SQLITE_DB_PATH=/app/data/crossfire.db
      - PORT=8000
      - LLM_PROVIDER=openai_compat
      - LLM_BASE_URL=http://gemini-proxy:8081/v1
    volumes:
      - crossfire-data:/app/data
    depends_on:
      - gemini-proxy

  gemini-proxy:
    build:
      context: https://github.com/Sophomoresty/gemini-web2api.git#main
    container_name: crossfire-proxy
    restart: unless-stopped
    ports:
      - "0.0.0.0:9127:8081"

volumes:
  crossfire-data:
