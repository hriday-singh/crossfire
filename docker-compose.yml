services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crossfire-frontend
    restart: unless-stopped
    ports:
      - "0.0.0.0:9125:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crossfire-backend
    restart: unless-stopped
    ports:
      - "0.0.0.0:9126:8000"
    environment:
      - SQLITE_DB_PATH=/app/data/crossfire.db
      - PORT=8000
      - LLM_PROVIDER=${LLM_PROVIDER:-openai_compat}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:8081/v1}
      # Required. An empty value here would shadow backend/.env and send
      # "Bearer none", which the proxy rejects as an invalid api key.
      - LLM_API_KEY=${LLM_API_KEY:?set LLM_API_KEY in the deploy .env}
      - CORS_ALLOWED_ORIGINS=https://crossfire.stratizone.com,http://localhost:5173,http://127.0.0.1:5173
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - crossfire-data:/app/data

volumes:
  crossfire-data:
